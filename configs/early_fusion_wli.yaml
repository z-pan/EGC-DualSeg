# Input-level fusion: resize and concatenate the two frames into a 6-channel
# input. This is the most widely used way to fuse two co-acquired frames, and it
# assumes correspondence at full pixel resolution — precisely the assumption the
# measured overlap between the two views says does not hold here. The arm is
# therefore a test of that assumption, and it is expected to underperform the
# single-modality model.
#
# It is the weakest rung of the operator ladder by construction, so it is not on
# its own sufficient evidence that the fusion operator matters. See
# docs/baseline_arms.md for the mid-level and parameter-matched arms that carry
# that comparison.
name: early_fusion_wli
mode: early
reference: WLI

npz: data/packaged/egc_dualseg_384.npz
manifest: data/packaged/manifest.csv
folds: configs/folds.csv
out_dir: results
ckpt_dir: checkpoints

epochs: 80
patience: 15
batch_size: 8
lr: 3.0e-4
backbone_lr: 1.0e-4
weight_decay: 1.0e-4
num_workers: 2
amp: true
pretrained: true

init_from: ""             # set to the Kvasir-pretrained checkpoint once available

folds_to_run: [0, 1, 2, 3, 4]
seeds: [0, 1, 2]
