# Straw-man: resize-and-concatenate the two frames into a 6-channel input.
# This is exactly the pixel-correspondence assumption the measured IoU of 0.279
# says does not hold, so it is expected to underperform the single-modality model.
name: early_fusion_wli
mode: early
reference: WLI

npz: data/packaged/egc_dualseg_384.npz
manifest: data/packaged/manifest.csv
folds: configs/folds.csv
out_dir: results
ckpt_dir: checkpoints

epochs: 80
patience: 15
batch_size: 8
lr: 3.0e-4
backbone_lr: 1.0e-4
weight_decay: 1.0e-4
num_workers: 2
amp: true
pretrained: true

init_from: ""             # set to the Kvasir-pretrained checkpoint once available

folds_to_run: [0, 1, 2, 3, 4]
seeds: [0, 1, 2]
